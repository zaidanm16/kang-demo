name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zaidanm16/kang-frontend
          path: frontend
          ssh-key: ${{ secrets.FRONTEND_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check offline fixtures and navigation
        working-directory: frontend
        run: npx vitest run demo/transport.test.ts lib/api/client-demo.test.ts lib/navigation/workspaceReturn.test.ts lib/navigation/instanceSwitch.test.ts --maxWorkers=2
      - name: Build the static demo export
        working-directory: frontend
        run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
