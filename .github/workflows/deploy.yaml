name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild whenever kang-frontend main moves, so new features reach the
    # demo without a manual rebuild commit.
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      frontend_sha: ${{ steps.decide.outputs.frontend_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          FRONTEND_DEPLOY_KEY: ${{ secrets.FRONTEND_DEPLOY_KEY }}
        run: |
          echo "$FRONTEND_DEPLOY_KEY" > frontend_deploy_key
          chmod 600 frontend_deploy_key
          frontend_sha=$(GIT_SSH_COMMAND="ssh -i frontend_deploy_key -o StrictHostKeyChecking=accept-new" \
            git ls-remote git@github.com:zaidanm16/kang-frontend.git main | awk '{print $1}')
          built_sha=$(cat .demo-version 2>/dev/null || echo "")
          echo "frontend main: $frontend_sha; built at: $built_sha"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$frontend_sha" != "$built_sha" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "frontend_sha=$frontend_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zaidanm16/kang-frontend
          path: frontend
          ssh-key: ${{ secrets.FRONTEND_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check offline fixtures and navigation
        working-directory: frontend
        run: npx vitest run demo/transport.test.ts lib/api/client-demo.test.ts lib/navigation/workspaceReturn.test.ts lib/navigation/instanceSwitch.test.ts --maxWorkers=2
      - name: Build the static demo export
        working-directory: frontend
        run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Record the built frontend revision
        env:
          FRONTEND_SHA: ${{ needs.check.outputs.frontend_sha }}
        run: |
          echo "$FRONTEND_SHA" > .demo-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .demo-version; then
            echo "demo version already recorded"
            exit 0
          fi
          git add .demo-version
          git commit -m "chore: sync demo to kang-frontend main ${FRONTEND_SHA:0:7}"
          git push origin main
